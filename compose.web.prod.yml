services:

  # Web server
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: video-streaming-backend
    restart: unless-stopped
    command: sh ./run_web.sh
    volumes:
      - .:/app
      - ./media:/app/media
      - static_volume:/app/static
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - WEB_HOST=${WEB_HOST}
      - WEB_PORT=${WEB_PORT}
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - CELERY_BROKER_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
      - CELERY_RESULT_BACKEND=redis://${REDIS_HOST}:${REDIS_PORT}/0
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME}
    networks:
      - app-network

  nginx:
    image: nginx:1.23-alpine
    ports:
      - "80:80" # External port 80 to internal port 80 of nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf  # Mount the custom Nginx config file into docker
      - static_volume:/app/static  # Mount the static files into NGINX
      - ./media:/app/media # Mount the media files into NGINX
    depends_on:
      - web
    networks:
      - app-network

networks:
  app-network:

volumes:
  static_volume: