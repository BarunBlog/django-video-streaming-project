services:
  flower:
    image: mher/flower:latest
    command: celery --broker=redis://${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB} flower --port=5000
    environment:
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}

    ports:
      - "5000:5000"
