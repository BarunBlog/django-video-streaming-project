services:

  # Database
  dev-db:
    image: postgres:latest
    container_name: video-streaming-db
    volumes:
      - postgres-db:/data/postgres
    restart: unless-stopped
    ports:
      - "5430:5432" # host port : internal service port
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - app-network

  # redis
  redis:
    hostname: redis
    restart: unless-stopped
    image: redis:8.0-M02-alpine
    ports:
      - "6379:6379"
    networks:
      - redis-network

  # Web server
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: video-streaming-backend
    restart: unless-stopped
    command: sh ./run_web.sh
    volumes:
      - .:/app
      - ./media:/app/media
      - static_volume:/app/static
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - WEB_HOST=${WEB_HOST}
      - WEB_PORT=${WEB_PORT}
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - CELERY_BROKER_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
      - CELERY_RESULT_BACKEND=redis://${REDIS_HOST}:${REDIS_PORT}/1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME}
    networks:
      - app-network
      - redis-network  # Connect the web service to both networks
    depends_on:
      - dev-db

  nginx:
    image: nginx:1.23-alpine
    ports:
      - "80:80" # External port 80 to internal port 80 of nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf  # Mount the custom Nginx config file into docker
      - static_volume:/app/static  # Mount the static files into NGINX
      - ./media:/app/media # Mount the media files into NGINX
    depends_on:
      - web
    networks:
      - app-network

  # Celery worker
  worker1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - CELERY_BROKER_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME}
    command: sh ./run_celery.sh
    volumes:
      - .:/app
    networks:
      - worker-network
      - redis-network # Connect the worker to both networks

  worker2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - CELERY_BROKER_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME}
    command: sh ./run_celery.sh
    volumes:
      - .:/app
    networks:
      - worker-network
      - redis-network # Connect the worker to both networks


networks:
  app-network:
    driver: bridge
  worker-network:
    driver: bridge
  redis-network:
    driver: bridge
  flower-network:
    driver: bridge
volumes:
  postgres-db:
  static_volume: